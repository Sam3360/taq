[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taq"
version = "0.2.0"
description = "TAQ (Tool Acquisition & Quick-install) - a lightweight Python package manager"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Samarth Chugh" }]
keywords = ["package manager", "pypi", "pip alternative", "installer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

# `packaging` is the same library pip/setuptools vendor for PEP 440/508/425
# parsing. Reimplementing version comparison and marker evaluation ourselves
# would be a large source of subtle bugs, so we treat it as standard
# packaging infrastructure rather than an "extra" dependency.
dependencies = [
    "packaging>=23.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://example.com/taq"

[project.scripts]
taq = "taq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taq = ["py.typed"]
